name: nfx-identity-dev

# HTTP 入口只有 NFX-Edge（先启动 Edge：共享网络 nfx-edge + Traefik）。
# 本栈不跑 reverse-proxy。traefik.project 由 Edge LabelRegex 发现。
# Must start NFX-Edge first (creates nfx-edge). This stack has no reverse-proxy.

services:
  auth-base:
    image: nfx-identity-auth-base:dev
    container_name: NFX-Identity-Auth-Base-Dev
    build:
      context: .
      dockerfile: inputs/auth/configuration/Dockerfile.Base
      target: dev
    environment:
      - ENV=dev
    command: [ "air", "-c", "inputs/auth/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_AUTH}"  # gRPC 端口
    ports:
      - "${GRPC_EXT_PORT_AUTH}:${GRPC_PORT_AUTH}"  # 映射 gRPC 端口到主机
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-identity"
      traefik.docker.network: nfx-edge
      traefik.http.services.identity-auth-base.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.identity-auth-base.entrypoints: web
      traefik.http.middlewares.nfx-identity-auth-gw.stripprefix.prefixes: ${API_GATEWAY_PREFIX}
      traefik.http.routers.identity-auth-base.rule: PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_AUTH}`)
      traefik.http.routers.identity-auth-base.priority: "20"
      traefik.http.routers.identity-auth-base.middlewares: nfx-identity-auth-gw
      traefik.http.routers.identity-auth-base.service: identity-auth-base
      traefik.http.routers.identity-auth-base-tls.entrypoints: websecure
      traefik.http.routers.identity-auth-base-tls.rule: PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_AUTH}`)
      traefik.http.routers.identity-auth-base-tls.priority: "20"
      traefik.http.routers.identity-auth-base-tls.middlewares: nfx-identity-auth-gw
      traefik.http.routers.identity-auth-base-tls.service: identity-auth-base
      traefik.http.routers.identity-auth-base-tls.tls: "true"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
    develop:
      watch:
        - action: sync
          path: inputs/auth/base
          target: /app/inputs/auth/base
        - action: sync
          path: inputs/auth/configuration
          target: /app/inputs/auth/configuration
        - action: sync
          path: modules/auth
          target: /app/modules/auth
        - action: sync
          path: enums
          target: /app/enums
        - action: sync
          path: errors/src
          target: /app/errors/src
        - action: sync
          path: events
          target: /app/events
        - action: sync
          path: pkgs
          target: /app/pkgs
        - action: sync
          path: protos
          target: /app/protos
        - action: sync
          path: go.mod
          target: /app/go.mod
        - action: sync
          path: go.sum
          target: /app/go.sum
        - action: sync
          path: .env
          target: /app/.env
        - action: rebuild
          path: inputs/auth/configuration/Dockerfile.Base
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-identity
      - nfx-edge
      - nfx-stack

  #! Image Base Service (all services in goroutines)
  asset-base:
    image: nfx-identity-asset-base:dev
    container_name: NFX-Identity-Asset-Base-Dev
    build:
      context: .
      dockerfile: inputs/asset/configuration/Dockerfile.Base
      target: dev
    environment:
      - ENV=dev
    command: [ "air", "-c", "inputs/asset/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_ASSET}"  # gRPC 端口
    ports:
      - "${GRPC_EXT_PORT_ASSET}:${GRPC_PORT_ASSET}"  # 映射 gRPC 端口到主机
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-identity"
      traefik.docker.network: nfx-edge
      traefik.http.services.identity-asset-base.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.identity-asset-base.entrypoints: web
      traefik.http.middlewares.nfx-identity-asset-gw.stripprefix.prefixes: ${API_GATEWAY_PREFIX}
      traefik.http.routers.identity-asset-base.rule: PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_ASSET}`)
      traefik.http.routers.identity-asset-base.priority: "20"
      traefik.http.routers.identity-asset-base.middlewares: nfx-identity-asset-gw
      traefik.http.routers.identity-asset-base.service: identity-asset-base
      traefik.http.routers.identity-asset-base-tls.entrypoints: websecure
      traefik.http.routers.identity-asset-base-tls.rule: PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_ASSET}`)
      traefik.http.routers.identity-asset-base-tls.priority: "20"
      traefik.http.routers.identity-asset-base-tls.middlewares: nfx-identity-asset-gw
      traefik.http.routers.identity-asset-base-tls.service: identity-asset-base
      traefik.http.routers.identity-asset-base-tls.tls: "true"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
      - ./inputs/asset/configuration/dev.toml:/app/inputs/asset/configuration/dev.toml:ro
    develop:
      watch:
        - action: sync
          path: inputs/asset/base
          target: /app/inputs/asset/base
        - action: sync
          path: inputs/asset/configuration
          target: /app/inputs/asset/configuration
        - action: sync
          path: modules/asset
          target: /app/modules/asset
        - action: sync
          path: enums
          target: /app/enums
        - action: sync
          path: errors/src
          target: /app/errors/src
        - action: sync
          path: events
          target: /app/events
        - action: sync
          path: pkgs
          target: /app/pkgs
        - action: sync
          path: protos
          target: /app/protos
        - action: sync
          path: go.mod
          target: /app/go.mod
        - action: sync
          path: go.sum
          target: /app/go.sum
        - action: sync
          path: .env
          target: /app/.env
        - action: rebuild
          path: inputs/asset/configuration/Dockerfile.Base
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-identity
      - nfx-edge
      - nfx-stack


  console:
    image: node:22-bookworm-slim
    container_name: NFX-Identity-Console-Dev
    working_dir: /app
    volumes:
      - ./console:/app
    command: ["node", "node_modules/vite/bin/vite.js", "--mode", "dev", "--host", "0.0.0.0"]
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_WS_URL: ${VITE_WS_URL}
      VITE_BUILD_ENV: ${VITE_BUILD_ENV:-dev}
      VITE_APP_ID: ${VITE_APP_ID:-nfx-console-dev}
      VITE_PORT: ${VITE_PORT}
      VITE_BASE: ${VITE_BASE}
      DOCKER: "1"
    expose:
      - "${VITE_PORT}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-identity"
      traefik.docker.network: nfx-edge
      traefik.http.services.identity-console.loadbalancer.server.port: "${VITE_PORT}"
      traefik.http.middlewares.identity-console-root.redirectregex.regex: ^https?://[^/]+/?$$
      traefik.http.middlewares.identity-console-root.redirectregex.replacement: https://${TRAEFIK_CONSOLE_HOST}/console/nfx-identity/
      traefik.http.middlewares.identity-console-root.redirectregex.permanent: "true"
      traefik.http.routers.identity-console.entrypoints: web
      traefik.http.routers.identity-console.rule: "HostRegexp(`^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$$`) && PathPrefix(`/console/nfx-identity`)"
      traefik.http.routers.identity-console.service: identity-console
      traefik.http.routers.identity-console.priority: "25"
      traefik.http.routers.identity-console-tls.entrypoints: websecure
      traefik.http.routers.identity-console-tls.rule: "HostRegexp(`^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$$`) && PathPrefix(`/console/nfx-identity`)"
      traefik.http.routers.identity-console-tls.service: identity-console
      traefik.http.routers.identity-console-tls.tls: "true"
      traefik.http.routers.identity-console-tls.priority: "25"
      traefik.http.routers.identity-console-host.entrypoints: web
      traefik.http.routers.identity-console-host.rule: Host(`${TRAEFIK_CONSOLE_HOST}`) && PathPrefix(`/console/nfx-identity`)
      traefik.http.routers.identity-console-host.service: identity-console
      traefik.http.routers.identity-console-host.priority: "200"
      traefik.http.routers.identity-console-host-tls.entrypoints: websecure
      traefik.http.routers.identity-console-host-tls.rule: Host(`${TRAEFIK_CONSOLE_HOST}`) && PathPrefix(`/console/nfx-identity`)
      traefik.http.routers.identity-console-host-tls.service: identity-console
      traefik.http.routers.identity-console-host-tls.tls: "true"
      traefik.http.routers.identity-console-host-tls.priority: "200"
      traefik.http.routers.identity-console-root.entrypoints: web
      traefik.http.routers.identity-console-root.rule: Host(`${TRAEFIK_CONSOLE_HOST}`) && Path(`/`)
      traefik.http.routers.identity-console-root.middlewares: identity-console-root
      traefik.http.routers.identity-console-root.service: identity-console
      traefik.http.routers.identity-console-root.priority: "210"
      traefik.http.routers.identity-console-root-tls.entrypoints: websecure
      traefik.http.routers.identity-console-root-tls.rule: Host(`${TRAEFIK_CONSOLE_HOST}`) && Path(`/`)
      traefik.http.routers.identity-console-root-tls.middlewares: identity-console-root
      traefik.http.routers.identity-console-root-tls.service: identity-console
      traefik.http.routers.identity-console-root-tls.tls: "true"
      traefik.http.routers.identity-console-root-tls.priority: "210"
    init: true
    networks:
      - nfx-identity
      - nfx-edge

networks:
  nfx-identity:
    name: nfx-identity
    driver: bridge
  nfx-edge:
    external: true
    name: nfx-edge
  nfx-stack:
    external: true
    name: nfx-stack
