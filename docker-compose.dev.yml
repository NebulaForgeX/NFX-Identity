name: nfx-identity-dev

services:
  reverse-proxy:
    image: traefik:latest
    container_name: NFX-Identity-Reverse-Proxy-Dev
    command:
      - --api.insecure=true
      - --providers.docker
      - --providers.docker.exposedByDefault=false
      - --providers.docker.constraints=Label(`traefik.project`, `nfx-identity`)
      - --entrypoints.web.address=:${TRAEFIK_HTTP_INTERNAL_PORT}
      - --entrypoints.traefik.address=:${TRAEFIK_DASHBOARD_INTERNAL_PORT}
    ports:
      - "${TRAEFIK_HTTP_PORT}:${TRAEFIK_HTTP_INTERNAL_PORT}"   # 内网 HTTP 入口
      - "${TRAEFIK_HTTPS_PORT}:${TRAEFIK_HTTPS_INTERNAL_PORT}"  # 外网 HTTPS 入口
      - "${TRAEFIK_DASHBOARD_PORT}:${TRAEFIK_DASHBOARD_INTERNAL_PORT}" # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-identity
    restart: unless-stopped

  #! Auth Base Service (all services in goroutines)
  auth-base:
    image: nfx-identity-auth-base:dev
    container_name: NFX-Identity-Auth-Base-Dev
    build:
      context: .
      dockerfile: inputs/auth/base/Dockerfile
      target: dev
    environment:
      - ENV=dev
    command: [ "air", "-c", "inputs/auth/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_AUTH}"  # gRPC 端口
    ports:
      - "${GRPC_PORT_AUTH}:${GRPC_PORT_AUTH}"  # 映射 gRPC 端口到主机
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-identity"
      traefik.http.routers.auth-base.entrypoints: web
      traefik.http.routers.auth-base.rule: PathPrefix(`${API_PREFIX_PATH_AUTH}`)
      traefik.http.services.auth-base.loadbalancer.server.port: "${HTTP_PORT}"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
    develop:
      watch:
        - action: sync
          path: inputs/auth/base
          target: /app/inputs/auth/base
        - action: sync
          path: inputs/auth/configuration
          target: /app/inputs/auth/configuration
        - action: sync
          path: modules/auth
          target: /app/modules/auth
        - action: sync
          path: enums
          target: /app/enums
        - action: sync
          path: errors/src
          target: /app/errors/src
        - action: sync
          path: events
          target: /app/events
        - action: sync
          path: pkgs
          target: /app/pkgs
        - action: sync
          path: protos
          target: /app/protos
        - action: sync
          path: go.mod
          target: /app/go.mod
        - action: sync
          path: go.sum
          target: /app/go.sum
        - action: sync
          path: .env
          target: /app/.env
        - action: rebuild
          path: inputs/auth/base/Dockerfile
    depends_on:
      reverse-proxy:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-identity

  #! Image Base Service (all services in goroutines)
  asset-base:
    image: nfx-identity-asset-base:dev
    container_name: NFX-Identity-Asset-Base-Dev
    build:
      context: .
      dockerfile: inputs/asset/base/Dockerfile
      target: dev
    environment:
      - ENV=dev
    command: [ "air", "-c", "inputs/asset/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_ASSET}"  # gRPC 端口
    ports:
      - "${GRPC_PORT_ASSET}:${GRPC_PORT_ASSET}"  # 映射 gRPC 端口到主机
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-identity"
      traefik.http.routers.asset-base.entrypoints: web
      traefik.http.routers.asset-base.rule: PathPrefix(`${API_PREFIX_PATH_ASSET}`)
      traefik.http.services.asset-base.loadbalancer.server.port: "${HTTP_PORT}"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
    develop:
      watch:
        - action: sync
          path: inputs/asset/base
          target: /app/inputs/asset/base
        - action: sync
          path: inputs/asset/configuration
          target: /app/inputs/asset/configuration
        - action: sync
          path: modules/asset
          target: /app/modules/asset
        - action: sync
          path: enums
          target: /app/enums
        - action: sync
          path: errors/src
          target: /app/errors/src
        - action: sync
          path: events
          target: /app/events
        - action: sync
          path: pkgs
          target: /app/pkgs
        - action: sync
          path: protos
          target: /app/protos
        - action: sync
          path: go.mod
          target: /app/go.mod
        - action: sync
          path: go.sum
          target: /app/go.sum
        - action: sync
          path: .env
          target: /app/.env
        - action: rebuild
          path: inputs/asset/base/Dockerfile
    depends_on:
      reverse-proxy:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-identity

  #! Access Base Service (all services in goroutines)
  system-base:
    image: nfx-identity-system-base:dev
    container_name: NFX-Identity-System-Base-Dev
    build:
      context: .
      dockerfile: inputs/system/base/Dockerfile
      target: dev
    environment:
      - ENV=dev
    command: [ "air", "-c", "inputs/system/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_SYSTEM}"  # gRPC 端口
    ports:
      - "${GRPC_PORT_SYSTEM}:${GRPC_PORT_SYSTEM}"  # 映射 gRPC 端口到主机
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-identity"
      traefik.http.routers.system-base.entrypoints: web
      traefik.http.routers.system-base.rule: PathPrefix(`${API_PREFIX_PATH_SYSTEM}`)
      traefik.http.services.system-base.loadbalancer.server.port: "${HTTP_PORT}"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
    develop:
      watch:
        - action: sync
          path: inputs/system/base
          target: /app/inputs/system/base
        - action: sync
          path: inputs/system/configuration
          target: /app/inputs/system/configuration
        - action: sync
          path: modules/system
          target: /app/modules/system
        - action: sync
          path: enums
          target: /app/enums
        - action: sync
          path: errors/src
          target: /app/errors/src
        - action: sync
          path: events
          target: /app/events
        - action: sync
          path: pkgs
          target: /app/pkgs
        - action: sync
          path: protos
          target: /app/protos
        - action: sync
          path: go.mod
          target: /app/go.mod
        - action: sync
          path: go.sum
          target: /app/go.sum
        - action: sync
          path: .env
          target: /app/.env
        - action: rebuild
          path: inputs/system/base/Dockerfile
    depends_on:
      reverse-proxy:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-identity

  #! Tenants Base Service (all services in goroutines)
networks:
  nfx-identity:
    name: nfx-identity
    driver: bridge
