name: nfx-identity-dev
# Publish HTTP, gRPC, and console on ${NAS_IP}:host port.
# NFX-Edge routes to those ports. This file has no Traefik labels and no shared network.

services:

  auth-base:
    image: nfx-identity-auth-base:dev
    container_name: NFX-Identity-Auth-Base-Dev
    build:
      context: .
      dockerfile: inputs/auth/configuration/Dockerfile.Base
      target: dev
    environment:
      - ENV=dev
    command: [ "air", "-c", "inputs/auth/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_AUTH}"  # gRPC 端口
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_AUTH}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_AUTH}:${GRPC_PORT_AUTH}"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
    develop:
      watch:
        - action: sync
          path: inputs/auth/base
          target: /app/inputs/auth/base
        - action: sync
          path: inputs/auth/configuration
          target: /app/inputs/auth/configuration
        - action: sync
          path: modules/auth
          target: /app/modules/auth
        - action: sync
          path: enums
          target: /app/enums
        - action: sync
          path: errors/src
          target: /app/errors/src
        - action: sync
          path: events
          target: /app/events
        - action: sync
          path: pkgs
          target: /app/pkgs
        - action: sync
          path: protos
          target: /app/protos
        - action: sync
          path: go.mod
          target: /app/go.mod
        - action: sync
          path: go.sum
          target: /app/go.sum
        - action: sync
          path: .env
          target: /app/.env
        - action: rebuild
          path: inputs/auth/configuration/Dockerfile.Base

  #! Image Base Service (all services in goroutines)

  asset-base:
    image: nfx-identity-asset-base:dev
    container_name: NFX-Identity-Asset-Base-Dev
    build:
      context: .
      dockerfile: inputs/asset/configuration/Dockerfile.Base
      target: dev
    environment:
      - ENV=dev
    command: [ "air", "-c", "inputs/asset/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_ASSET}"  # gRPC 端口
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_ASSET}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_ASSET}:${GRPC_PORT_ASSET}"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
      - ./inputs/asset/configuration/dev.toml:/app/inputs/asset/configuration/dev.toml:ro
    develop:
      watch:
        - action: sync
          path: inputs/asset/base
          target: /app/inputs/asset/base
        - action: sync
          path: inputs/asset/configuration
          target: /app/inputs/asset/configuration
        - action: sync
          path: modules/asset
          target: /app/modules/asset
        - action: sync
          path: enums
          target: /app/enums
        - action: sync
          path: errors/src
          target: /app/errors/src
        - action: sync
          path: events
          target: /app/events
        - action: sync
          path: pkgs
          target: /app/pkgs
        - action: sync
          path: protos
          target: /app/protos
        - action: sync
          path: go.mod
          target: /app/go.mod
        - action: sync
          path: go.sum
          target: /app/go.sum
        - action: sync
          path: .env
          target: /app/.env
        - action: rebuild
          path: inputs/asset/configuration/Dockerfile.Base

  console:
    image: node:22-bookworm-slim
    container_name: NFX-Identity-Console-Dev
    working_dir: /app
    volumes:
      - ./console:/app
    command: ["node", "node_modules/vite/bin/vite.js", "--mode", "dev", "--host", "0.0.0.0"]
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_BUILD_ENV: ${VITE_BUILD_ENV:-dev}
      VITE_APP_ID: ${VITE_APP_ID:-nfx-console-dev}
      VITE_PORT: ${VITE_PORT}
      VITE_BASE: ${VITE_BASE}
      DOCKER: "1"
    expose:
      - "${VITE_PORT}"
    ports:
      - "${NAS_IP}:${CONSOLE_EXTERNAL_PORT}:${VITE_PORT}"
    init: true
