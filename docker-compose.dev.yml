name: nfx-identity-dev

# HTTP 入口只有 NFX-Edge（先启动 Edge：共享网络 nfx-edge + Traefik）。
# 本栈不跑 reverse-proxy。traefik.project 由 Edge LabelRegex 发现。
# Must start NFX-Edge first (creates nfx-edge). This stack has no reverse-proxy.

services:
  auth-base:
    image: nfx-identity-auth-base:dev
    container_name: NFX-Identity-Auth-Base-Dev
    build:
      context: .
      dockerfile: inputs/auth/configuration/Dockerfile.Base
      target: dev
    environment:
      - ENV=dev
    command: [ "air", "-c", "inputs/auth/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_AUTH}"  # gRPC 端口
    ports:
      - "${GRPC_EXT_PORT_AUTH}:${GRPC_PORT_AUTH}"  # 映射 gRPC 端口到主机
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-identity"
      traefik.http.services.identity-auth-base.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.identity-auth-base.entrypoints: web
      traefik.http.routers.identity-auth-base.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_AUTH}`)
      traefik.http.routers.identity-auth-base.service: identity-auth-base
      traefik.http.routers.identity-auth-base-secure.entrypoints: websecure
      traefik.http.routers.identity-auth-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_AUTH}`)
      traefik.http.routers.identity-auth-base-secure.service: identity-auth-base
      traefik.http.routers.identity-auth-base-secure.tls: "true"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
    develop:
      watch:
        - action: sync
          path: inputs/auth/base
          target: /app/inputs/auth/base
        - action: sync
          path: inputs/auth/configuration
          target: /app/inputs/auth/configuration
        - action: sync
          path: modules/auth
          target: /app/modules/auth
        - action: sync
          path: enums
          target: /app/enums
        - action: sync
          path: errors/src
          target: /app/errors/src
        - action: sync
          path: events
          target: /app/events
        - action: sync
          path: pkgs
          target: /app/pkgs
        - action: sync
          path: protos
          target: /app/protos
        - action: sync
          path: go.mod
          target: /app/go.mod
        - action: sync
          path: go.sum
          target: /app/go.sum
        - action: sync
          path: .env
          target: /app/.env
        - action: rebuild
          path: inputs/auth/configuration/Dockerfile.Base
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-identity
      - nfx-edge
      - nfx-stack

  #! Image Base Service (all services in goroutines)
  asset-base:
    image: nfx-identity-asset-base:dev
    container_name: NFX-Identity-Asset-Base-Dev
    build:
      context: .
      dockerfile: inputs/asset/configuration/Dockerfile.Base
      target: dev
    environment:
      - ENV=dev
    command: [ "air", "-c", "inputs/asset/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_ASSET}"  # gRPC 端口
    ports:
      - "${GRPC_EXT_PORT_ASSET}:${GRPC_PORT_ASSET}"  # 映射 gRPC 端口到主机
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-identity"
      traefik.http.services.identity-asset-base.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.identity-asset-base.entrypoints: web
      traefik.http.routers.identity-asset-base.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_ASSET}`)
      traefik.http.routers.identity-asset-base.service: identity-asset-base
      traefik.http.routers.identity-asset-base-secure.entrypoints: websecure
      traefik.http.routers.identity-asset-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_ASSET}`)
      traefik.http.routers.identity-asset-base-secure.service: identity-asset-base
      traefik.http.routers.identity-asset-base-secure.tls: "true"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
    develop:
      watch:
        - action: sync
          path: inputs/asset/base
          target: /app/inputs/asset/base
        - action: sync
          path: inputs/asset/configuration
          target: /app/inputs/asset/configuration
        - action: sync
          path: modules/asset
          target: /app/modules/asset
        - action: sync
          path: enums
          target: /app/enums
        - action: sync
          path: errors/src
          target: /app/errors/src
        - action: sync
          path: events
          target: /app/events
        - action: sync
          path: pkgs
          target: /app/pkgs
        - action: sync
          path: protos
          target: /app/protos
        - action: sync
          path: go.mod
          target: /app/go.mod
        - action: sync
          path: go.sum
          target: /app/go.sum
        - action: sync
          path: .env
          target: /app/.env
        - action: rebuild
          path: inputs/asset/configuration/Dockerfile.Base
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-identity
      - nfx-edge
      - nfx-stack

  #! Access Base Service (all services in goroutines)
  system-base:
    image: nfx-identity-system-base:dev
    container_name: NFX-Identity-System-Base-Dev
    build:
      context: .
      dockerfile: inputs/system/configuration/Dockerfile.Base
      target: dev
    environment:
      - ENV=dev
    command: [ "air", "-c", "inputs/system/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_SYSTEM}"  # gRPC 端口
    ports:
      - "${GRPC_EXT_PORT_SYSTEM}:${GRPC_PORT_SYSTEM}"  # 映射 gRPC 端口到主机
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-identity"
      traefik.http.services.identity-system-base.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.identity-system-base.entrypoints: web
      traefik.http.routers.identity-system-base.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_SYSTEM}`)
      traefik.http.routers.identity-system-base.service: identity-system-base
      traefik.http.routers.identity-system-base-secure.entrypoints: websecure
      traefik.http.routers.identity-system-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_SYSTEM}`)
      traefik.http.routers.identity-system-base-secure.service: identity-system-base
      traefik.http.routers.identity-system-base-secure.tls: "true"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
    develop:
      watch:
        - action: sync
          path: inputs/system/base
          target: /app/inputs/system/base
        - action: sync
          path: inputs/system/configuration
          target: /app/inputs/system/configuration
        - action: sync
          path: modules/system
          target: /app/modules/system
        - action: sync
          path: enums
          target: /app/enums
        - action: sync
          path: errors/src
          target: /app/errors/src
        - action: sync
          path: events
          target: /app/events
        - action: sync
          path: pkgs
          target: /app/pkgs
        - action: sync
          path: protos
          target: /app/protos
        - action: sync
          path: go.mod
          target: /app/go.mod
        - action: sync
          path: go.sum
          target: /app/go.sum
        - action: sync
          path: .env
          target: /app/.env
        - action: rebuild
          path: inputs/system/configuration/Dockerfile.Base
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-identity
      - nfx-edge
      - nfx-stack

  console:
    image: nfx-identity-console:dev
    container_name: NFX-Identity-Console-Dev
    build:
      context: ./console
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_BUILD_ENV: ${VITE_BUILD_ENV:-dev}
        VITE_APP_ID: ${VITE_APP_ID:-nfx-console-dev}
    ports:
      - "${CONSOLE_EXTERNAL_PORT}:${CONSOLE_PORT}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-identity"
      traefik.http.services.identity-console.loadbalancer.server.port: "${CONSOLE_PORT}"
      traefik.http.routers.identity-console.entrypoints: web
      traefik.http.routers.identity-console.rule: Host(`${TRAEFIK_CONSOLE_HOST}`)
      traefik.http.routers.identity-console.service: identity-console
      traefik.http.routers.identity-console.priority: "1"
      traefik.http.routers.identity-console-secure.entrypoints: websecure
      traefik.http.routers.identity-console-secure.rule: Host(`${TRAEFIK_CONSOLE_HOST}`)
      traefik.http.routers.identity-console-secure.service: identity-console
      traefik.http.routers.identity-console-secure.tls: "true"
      traefik.http.routers.identity-console-secure.priority: "1"
    networks:
      - nfx-identity
      - nfx-edge

networks:
  nfx-identity:
    name: nfx-identity
    driver: bridge
  nfx-edge:
    external: true
    name: nfx-edge
  nfx-stack:
    external: true
    name: nfx-stack
