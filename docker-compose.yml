name: nfx-identity

services:
  reverse-proxy:
    image: traefik:v3.4
    container_name: NFX-Identity-Reverse-Proxy-Prod
    restart: always
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker
      - --providers.docker.exposedByDefault=false
      - --providers.docker.constraints=Label(`traefik.project`, `nfx-identity`)
      # 文件配置（动态规则目录）
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # HTTP 和 HTTPS 入口
      - --entrypoints.web.address=:${TRAEFIK_HTTP_INTERNAL_PORT}
      - --entrypoints.websecure.address=:${TRAEFIK_HTTPS_INTERNAL_PORT}
      # HTTP → HTTPS 重定向（外网）
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    ports:
      - "${TRAEFIK_HTTP_PORT}:${TRAEFIK_HTTP_INTERNAL_PORT}"   # 内网 HTTP 入口
      - "${TRAEFIK_HTTPS_PORT}:${TRAEFIK_HTTPS_INTERNAL_PORT}"  # 外网 HTTPS 入口
      - "${TRAEFIK_DASHBOARD_PORT}:${TRAEFIK_DASHBOARD_INTERNAL_PORT}" # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${CERTS_DIR}:/certs/websites:ro
      - ${TRAEFIK_CONFIG_FILE}:/etc/traefik/traefik.yml:ro
      - ${TRAEFIK_DYNAMIC_DIR}:/etc/traefik/dynamic:ro
    networks:
      - nfx-identity

  #! Auth API Service
  auth-api:
    image: nfx-identity-auth-api:prod
    container_name: NFX-Identity-Auth-API-Prod
    build:
      context: .
      dockerfile: inputs/auth/api/Dockerfile
    restart: always
    expose:
      - "${HTTP_PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.project=nfx-identity"
      # 服务定义
      - "traefik.http.services.auth-api.loadbalancer.server.port=${HTTP_PORT}"
      # 外网 HTTPS 路由
      - "traefik.http.routers.auth-api-secure.rule=Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_AUTH}`)"
      - "traefik.http.routers.auth-api-secure.entrypoints=websecure"
      - "traefik.http.routers.auth-api-secure.service=auth-api"
      - "traefik.http.routers.auth-api-secure.tls=true"
      # 内网 HTTP 路由（通过端口访问，允许任何 Host）
      - "traefik.http.routers.auth-api-insecure.rule=HostRegexp(`.*`) && PathPrefix(`${API_PREFIX_PATH_AUTH}`)"
      - "traefik.http.routers.auth-api-insecure.entrypoints=web"
      - "traefik.http.routers.auth-api-insecure.service=auth-api"
    environment:
      - ENV=prod
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
    depends_on:
      - reverse-proxy
    networks:
      - nfx-identity

  #! Auth Pipeline Service（kafka）
  auth-pipeline:
    image: nfx-identity-auth-pipeline:prod
    container_name: NFX-Identity-Auth-Pipeline-Prod 
    build:
      context: .
      dockerfile: inputs/auth/pipeline/Dockerfile
    restart: always
    environment:
      - ENV=prod
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
    networks:
      - nfx-identity
    depends_on:
      - auth-api

  #! Auth Connection Service (gRPC)
  auth-connection:
    image: nfx-identity-auth-connection:prod
    container_name: NFX-Identity-Auth-Connection-Prod
    build:
      context: .
      dockerfile: inputs/auth/connection/Dockerfile
    restart: always
    expose:
      - "${GRPC_PORT_AUTH}"  # gRPC 端口（与 prod.toml 中的 grpc_port 一致）
    ports:
      - "${GRPC_PORT_AUTH}:${GRPC_PORT_AUTH}"  # 映射 gRPC 端口到主机
    environment:
      - ENV=prod
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
    networks:
      - nfx-identity
    depends_on:
      - auth-api

  #! Image API Service
  asset-api:
    image: nfx-identity-asset-api:prod
    container_name: NFX-Identity-Asset-API-Prod
    build:
      context: .
      dockerfile: inputs/asset/api/Dockerfile
    restart: always
    expose:
      - "${HTTP_PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.project=nfx-identity"
      # 服务定义
      - "traefik.http.services.asset-api.loadbalancer.server.port=${HTTP_PORT}"
      # 外网 HTTPS 路由
      - "traefik.http.routers.asset-api-secure.rule=Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_ASSET}`)"
      - "traefik.http.routers.asset-api-secure.entrypoints=websecure"
      - "traefik.http.routers.asset-api-secure.service=asset-api"
      - "traefik.http.routers.asset-api-secure.tls=true"
      # 内网 HTTP 路由
      - "traefik.http.routers.asset-api-insecure.rule=HostRegexp(`.*`) && PathPrefix(`${API_PREFIX_PATH_ASSET}`)"
      - "traefik.http.routers.asset-api-insecure.entrypoints=web"
      - "traefik.http.routers.asset-api-insecure.service=asset-api"
    environment:
      - ENV=prod
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
    depends_on:
      - reverse-proxy
    networks:
      - nfx-identity


  #! Image Connection Service (gRPC)
  asset-connection:
    image: nfx-identity-asset-connection:prod
    container_name: NFX-Identity-Asset-Connection-Prod
    build:
      context: .
      dockerfile: inputs/asset/connection/Dockerfile
    restart: always
    expose:
      - "${GRPC_PORT_ASSET}"  # gRPC 端口（与 prod.toml 中的 grpc_port 一致）
    ports:
      - "${GRPC_PORT_ASSET}:${GRPC_PORT_ASSET}"  # 映射 gRPC 端口到主机
    environment:
      - ENV=prod
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
    networks:
      - nfx-identity
    depends_on:
      - asset-api

  #! Auth Messaging Service
  system-api:
    image: nfx-identity-system-api:prod
    container_name: NFX-Identity-System-API-Prod
    build:
      context: .
      dockerfile: inputs/system/api/Dockerfile
    restart: always
    expose:
      - "${HTTP_PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.project=nfx-identity"
      # 服务定义
      - "traefik.http.services.system-api.loadbalancer.server.port=${HTTP_PORT}"
      # 外网 HTTPS 路由
      - "traefik.http.routers.system-api-secure.rule=Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_SYSTEM}`)"
      - "traefik.http.routers.system-api-secure.entrypoints=websecure"
      - "traefik.http.routers.system-api-secure.service=system-api"
      - "traefik.http.routers.system-api-secure.tls=true"
      # 内网 HTTP 路由
      - "traefik.http.routers.system-api-insecure.rule=HostRegexp(`.*`) && PathPrefix(`${API_PREFIX_PATH_SYSTEM}`)"
      - "traefik.http.routers.system-api-insecure.entrypoints=web"
      - "traefik.http.routers.system-api-insecure.service=system-api"
    environment:
      - ENV=prod
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
    depends_on:
      - reverse-proxy
    networks:
      - nfx-identity

  #! System Pipeline Service
  system-pipeline:
    image: nfx-identity-system-pipeline:prod
    container_name: NFX-Identity-System-Pipeline-Prod
    build:
      context: .
      dockerfile: inputs/system/pipeline/Dockerfile
    restart: always
    environment:
      - ENV=prod
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
    networks:
      - nfx-identity
    depends_on:
      - system-api

  #! System Connection Service (gRPC)
  system-connection:
    image: nfx-identity-system-connection:prod
    container_name: NFX-Identity-System-Connection-Prod
    build:
      context: .
      dockerfile: inputs/system/connection/Dockerfile
    restart: always
    expose:
      - "${GRPC_PORT_SYSTEM}"  # gRPC 端口（与 prod.toml 中的 grpc_port 一致）
    ports:
      - "${GRPC_PORT_SYSTEM}:${GRPC_PORT_SYSTEM}"  # 映射 gRPC 端口到主机
    environment:
      - ENV=prod
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
    networks:
      - nfx-identity
    depends_on:
      - system-api

  #! System Messaging Service
  system-messaging:
    image: nfx-identity-system-messaging:prod
    container_name: NFX-Identity-System-Messaging-Prod
    build:
      context: .
      dockerfile: inputs/system/messaging/Dockerfile
    restart: always
    environment:
      - ENV=prod
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
    networks:
      - nfx-identity
    depends_on:
      - system-api

  #! Tenants API Service
  console:
    image: nfx-identity-console-api:prod
    container_name: NFX-Identity-Console-Prod
    build:
      context: .
      dockerfile: console/Dockerfile
    restart: always
    ports:
      - "${CONSOLE_EXTERNAL_PORT}:${CONSOLE_PORT}"  # 直接访问前端端口
    expose:
      - "${CONSOLE_PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.project=nfx-identity"
      # 服务定义
      - "traefik.http.services.console.loadbalancer.server.port=${CONSOLE_PORT}"
      # 外网 HTTPS 路由 - 控制面板根路径
      - "traefik.http.routers.console-secure.rule=Host(`${TRAEFIK_CONSOLE_HOST}`) && PathPrefix(`/`)"
      - "traefik.http.routers.console-secure.entrypoints=websecure"
      - "traefik.http.routers.console-secure.service=console"
      - "traefik.http.routers.console-secure.tls=true"
      - "traefik.http.routers.console-secure.priority=1"  # 高优先级，确保根路径匹配
      # 内网 HTTP 路由
      - "traefik.http.routers.console-insecure.rule=HostRegexp(`.*`) && PathPrefix(`/`)"
      - "traefik.http.routers.console-insecure.entrypoints=web"
      - "traefik.http.routers.console-insecure.service=console"
      - "traefik.http.routers.console-insecure.priority=1"  # 高优先级
    environment:
      - ENV=prod
    depends_on:
      - reverse-proxy
    networks:
      - nfx-identity


networks:
  nfx-identity:
    name: nfx-identity
    driver: bridge


