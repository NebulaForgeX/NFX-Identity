name: nfx-identity

# HTTP 入口只有 NFX-Edge（先启动 Edge：共享网络 nfx-edge + Traefik）。
# 本栈不跑 reverse-proxy。traefik.project 由 Edge LabelRegex 发现。
# Must start NFX-Edge first (creates nfx-edge). This stack has no reverse-proxy.

services:
  auth-api:
    image: nfx-identity-auth-api:prod
    container_name: NFX-Identity-Auth-API-Prod
    build:
      context: .
      dockerfile: inputs/auth/api/Dockerfile
    restart: always
    expose:
      - "${HTTP_PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.project=nfx-identity"
      # 服务定义
      - "traefik.http.services.identity-auth-api.loadbalancer.server.port=${HTTP_PORT}"
      # 外网 HTTPS 路由
      - "traefik.http.routers.identity-auth-api-secure.rule=Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_AUTH}`)"
      - "traefik.http.routers.identity-auth-api-secure.entrypoints=websecure"
      - "traefik.http.routers.identity-auth-api-secure.service=identity-auth-api"
      - "traefik.http.routers.identity-auth-api-secure.tls=true"
      # 内网 HTTP 路由（通过端口访问，允许任何 Host）
      - "traefik.http.routers.identity-auth-api.rule=Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_AUTH}`)"
      - "traefik.http.routers.identity-auth-api.entrypoints=web"
      - "traefik.http.routers.identity-auth-api.service=identity-auth-api"
    environment:
      - ENV=prod
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
    networks:
      - nfx-identity
      - nfx-edge

  #! Auth Pipeline Service（kafka）
  auth-pipeline:
    image: nfx-identity-auth-pipeline:prod
    container_name: NFX-Identity-Auth-Pipeline-Prod 
    build:
      context: .
      dockerfile: inputs/auth/pipeline/Dockerfile
    restart: always
    environment:
      - ENV=prod
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
    networks:
      - nfx-identity
    depends_on:
      - auth-api

  #! Auth Connection Service (gRPC)
  auth-connection:
    image: nfx-identity-auth-connection:prod
    container_name: NFX-Identity-Auth-Connection-Prod
    build:
      context: .
      dockerfile: inputs/auth/connection/Dockerfile
    restart: always
    expose:
      - "${GRPC_PORT_AUTH}"  # gRPC 端口（与 prod.toml 中的 grpc_port 一致）
    ports:
      - "${GRPC_PORT_AUTH}:${GRPC_PORT_AUTH}"  # 映射 gRPC 端口到主机
    environment:
      - ENV=prod
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
    networks:
      - nfx-identity
    depends_on:
      - auth-api

  #! Image API Service
  asset-api:
    image: nfx-identity-asset-api:prod
    container_name: NFX-Identity-Asset-API-Prod
    build:
      context: .
      dockerfile: inputs/asset/api/Dockerfile
    restart: always
    expose:
      - "${HTTP_PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.project=nfx-identity"
      # 服务定义
      - "traefik.http.services.identity-asset-api.loadbalancer.server.port=${HTTP_PORT}"
      # 外网 HTTPS 路由
      - "traefik.http.routers.identity-asset-api-secure.rule=Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_ASSET}`)"
      - "traefik.http.routers.identity-asset-api-secure.entrypoints=websecure"
      - "traefik.http.routers.identity-asset-api-secure.service=identity-asset-api"
      - "traefik.http.routers.identity-asset-api-secure.tls=true"
      # 内网 HTTP 路由
      - "traefik.http.routers.identity-asset-api.rule=Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_ASSET}`)"
      - "traefik.http.routers.identity-asset-api.entrypoints=web"
      - "traefik.http.routers.identity-asset-api.service=identity-asset-api"
    environment:
      - ENV=prod
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
    networks:
      - nfx-identity
      - nfx-edge


  #! Image Connection Service (gRPC)
  asset-connection:
    image: nfx-identity-asset-connection:prod
    container_name: NFX-Identity-Asset-Connection-Prod
    build:
      context: .
      dockerfile: inputs/asset/connection/Dockerfile
    restart: always
    expose:
      - "${GRPC_PORT_ASSET}"  # gRPC 端口（与 prod.toml 中的 grpc_port 一致）
    ports:
      - "${GRPC_PORT_ASSET}:${GRPC_PORT_ASSET}"  # 映射 gRPC 端口到主机
    environment:
      - ENV=prod
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
    networks:
      - nfx-identity
    depends_on:
      - asset-api

  #! Auth Messaging Service
  system-api:
    image: nfx-identity-system-api:prod
    container_name: NFX-Identity-System-API-Prod
    build:
      context: .
      dockerfile: inputs/system/api/Dockerfile
    restart: always
    expose:
      - "${HTTP_PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.project=nfx-identity"
      # 服务定义
      - "traefik.http.services.identity-system-api.loadbalancer.server.port=${HTTP_PORT}"
      # 外网 HTTPS 路由
      - "traefik.http.routers.identity-system-api-secure.rule=Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_SYSTEM}`)"
      - "traefik.http.routers.identity-system-api-secure.entrypoints=websecure"
      - "traefik.http.routers.identity-system-api-secure.service=identity-system-api"
      - "traefik.http.routers.identity-system-api-secure.tls=true"
      # 内网 HTTP 路由
      - "traefik.http.routers.identity-system-api.rule=Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_SYSTEM}`)"
      - "traefik.http.routers.identity-system-api.entrypoints=web"
      - "traefik.http.routers.identity-system-api.service=identity-system-api"
    environment:
      - ENV=prod
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
    networks:
      - nfx-identity
      - nfx-edge

  #! System Pipeline Service
  system-pipeline:
    image: nfx-identity-system-pipeline:prod
    container_name: NFX-Identity-System-Pipeline-Prod
    build:
      context: .
      dockerfile: inputs/system/pipeline/Dockerfile
    restart: always
    environment:
      - ENV=prod
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
    networks:
      - nfx-identity
    depends_on:
      - system-api

  #! System Connection Service (gRPC)
  system-connection:
    image: nfx-identity-system-connection:prod
    container_name: NFX-Identity-System-Connection-Prod
    build:
      context: .
      dockerfile: inputs/system/connection/Dockerfile
    restart: always
    expose:
      - "${GRPC_PORT_SYSTEM}"  # gRPC 端口（与 prod.toml 中的 grpc_port 一致）
    ports:
      - "${GRPC_PORT_SYSTEM}:${GRPC_PORT_SYSTEM}"  # 映射 gRPC 端口到主机
    environment:
      - ENV=prod
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
    networks:
      - nfx-identity
    depends_on:
      - system-api

  #! System Messaging Service
  system-messaging:
    image: nfx-identity-system-messaging:prod
    container_name: NFX-Identity-System-Messaging-Prod
    build:
      context: .
      dockerfile: inputs/system/messaging/Dockerfile
    restart: always
    environment:
      - ENV=prod
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
    networks:
      - nfx-identity
    depends_on:
      - system-api

  #! Tenants API Service
  console:
    image: nfx-identity-console:prod
    container_name: NFX-Identity-Console-Prod
    build:
      context: ./console
      dockerfile: Dockerfile
      additional_contexts:
        nfx-ui: ../NFX-UI
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_BUILD_ENV: ${VITE_BUILD_ENV:-prod}
        VITE_APP_ID: ${VITE_APP_ID:-nfx-console-prod}
    restart: always
    ports:
      - "${CONSOLE_EXTERNAL_PORT}:${CONSOLE_PORT}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-identity"
      traefik.http.services.identity-console.loadbalancer.server.port: "${CONSOLE_PORT}"
      traefik.http.routers.identity-console.entrypoints: web
      traefik.http.routers.identity-console.rule: Host(`${TRAEFIK_CONSOLE_HOST}`)
      traefik.http.routers.identity-console.service: identity-console
      traefik.http.routers.identity-console.priority: "1"
      traefik.http.routers.identity-console-secure.entrypoints: websecure
      traefik.http.routers.identity-console-secure.rule: Host(`${TRAEFIK_CONSOLE_HOST}`)
      traefik.http.routers.identity-console-secure.service: identity-console
      traefik.http.routers.identity-console-secure.tls: "true"
      traefik.http.routers.identity-console-secure.priority: "1"
    networks:
      - nfx-identity
      - nfx-edge

networks:
  nfx-identity:
    name: nfx-identity
    driver: bridge

  nfx-edge:
    external: true
    name: nfx-edge
