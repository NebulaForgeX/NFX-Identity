name: nfx-identity-secure
# Publish HTTP, gRPC, and console on ${NAS_IP}:host port.
# NFX-Edge routes to those ports. This file has no Traefik labels and no shared network.

services:

  auth-base:
    image: nfx-identity-auth-base:secure
    container_name: NFX-Identity-Auth-Base-Secure
    build:
      context: .
      dockerfile: inputs/auth/configuration/Dockerfile.Base
      target: secure
    env_file:
      - .secure.env
    environment:
      - ENV=secure
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_AUTH}"  # gRPC 端口
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_AUTH}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_AUTH}:${GRPC_PORT_AUTH}"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
    restart: always

  #! Image Base Service (all services in goroutines)

  asset-base:
    image: nfx-identity-asset-base:secure
    container_name: NFX-Identity-Asset-Base-Secure
    build:
      context: .
      dockerfile: inputs/asset/configuration/Dockerfile.Base
      target: secure
    env_file:
      - .secure.env
    environment:
      - ENV=secure
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_ASSET}"  # gRPC 端口
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_ASSET}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_ASSET}:${GRPC_PORT_ASSET}"
    volumes:
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
      - ./inputs/asset/configuration/secure.toml:/app/config.toml:ro
    restart: always

  console:
    image: nfx-identity-console:secure
    container_name: NFX-Identity-Console-Secure
    build:
      context: ./console
      dockerfile: Dockerfile
      target: secure
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_BUILD_ENV: ${VITE_BUILD_ENV:-secure}
        VITE_APP_ID: ${VITE_APP_ID:-nfx-console-secure}
        VITE_BASE: ${VITE_BASE}
    ports:
      - "${NAS_IP}:${CONSOLE_EXTERNAL_PORT}:${CONSOLE_PORT}"
    restart: always
