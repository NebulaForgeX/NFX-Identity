syntax = "proto3";
package asset;

option go_package = "nfxidentity/protos/gen/asset/audio;audiopb";

message Audio {
  string id = 1;
  string file_path = 2;
  string file_name = 3;
  int64 file_size = 4;
  string mime_type = 5;
  string uploader_id = 6;
}

message GetAudioByIDRequest { string id = 1; }
message GetAudioByIDResponse { Audio audio = 1; }
message BatchGetAudiosRequest { repeated string ids = 1; }
message BatchGetAudiosResponse { repeated Audio audios = 1; }
message PrepareAudioUploadRequest {
  string account_id = 1;
  string file_name = 2;
  string mime_type = 3;
}
message PrepareAudioUploadResponse {
  string audio_id = 1;
  string upload_url = 2;
  string file_path = 3;
}
message ConfirmAudioUploadRequest {
  string account_id = 1;
  string audio_id = 2;
}
message ConfirmAudioUploadResponse { Audio audio = 1; }
message PrepareAudioUploadItem {
  string file_name = 1;
  string mime_type = 2;
}
message PrepareAudiosUploadRequest {
  string account_id = 1;
  repeated PrepareAudioUploadItem items = 2;
}
message PrepareAudioUploadResult {
  string audio_id = 1;
  string upload_url = 2;
  string file_path = 3;
}
message PrepareAudiosUploadResponse { repeated PrepareAudioUploadResult results = 1; }
message ConfirmAudiosUploadRequest {
  string account_id = 1;
  repeated string audio_ids = 2;
}
message ConfirmAudiosUploadResponse { repeated Audio audios = 1; }
message DeleteAudioRequest {
  string id = 1;
  string account_id = 2;
}
message DeleteAudioResponse {}

service AudioService {
  rpc GetAudioByID (GetAudioByIDRequest) returns (GetAudioByIDResponse);
  rpc BatchGetAudios (BatchGetAudiosRequest) returns (BatchGetAudiosResponse);
  rpc PrepareAudioUpload (PrepareAudioUploadRequest) returns (PrepareAudioUploadResponse);
  rpc PrepareAudiosUpload (PrepareAudiosUploadRequest) returns (PrepareAudiosUploadResponse);
  rpc ConfirmAudioUpload (ConfirmAudioUploadRequest) returns (ConfirmAudioUploadResponse);
  rpc ConfirmAudiosUpload (ConfirmAudiosUploadRequest) returns (ConfirmAudiosUploadResponse);
  rpc DeleteAudio (DeleteAudioRequest) returns (DeleteAudioResponse);
}
