syntax = "proto3";
package asset;

option go_package = "nfxidentity/protos/gen/asset/image;imagepb";

message Image {
  string id = 1;
  string file_path = 2;
  string file_name = 3;
  int64 file_size = 4;
  string mime_type = 5;
  string uploader_id = 6;
}

message GetImageByIDRequest { string id = 1; }
message GetImageByIDResponse { Image image = 1; }
message BatchGetImagesRequest { repeated string ids = 1; }
message BatchGetImagesResponse { repeated Image images = 1; }
message PrepareImageUploadRequest {
  string account_id = 1;
  string file_name = 2;
  string mime_type = 3;
}
message PrepareImageUploadResponse {
  string image_id = 1;
  string upload_url = 2;
  string file_path = 3;
}
message ConfirmImageUploadRequest {
  string account_id = 1;
  string image_id = 2;
}
message ConfirmImageUploadResponse { Image image = 1; }
message PrepareImageUploadItem {
  string file_name = 1;
  string mime_type = 2;
}
message PrepareImagesUploadRequest {
  string account_id = 1;
  repeated PrepareImageUploadItem items = 2;
}
message PrepareImageUploadResult {
  string image_id = 1;
  string upload_url = 2;
  string file_path = 3;
}
message PrepareImagesUploadResponse { repeated PrepareImageUploadResult results = 1; }
message ConfirmImagesUploadRequest {
  string account_id = 1;
  repeated string image_ids = 2;
}
message ConfirmImagesUploadResponse { repeated Image images = 1; }
message DeleteImageRequest {
  string id = 1;
  string account_id = 2;
}
message DeleteImageResponse {}

service ImageService {
  rpc GetImageByID (GetImageByIDRequest) returns (GetImageByIDResponse);
  rpc BatchGetImages (BatchGetImagesRequest) returns (BatchGetImagesResponse);
  rpc PrepareImageUpload (PrepareImageUploadRequest) returns (PrepareImageUploadResponse);
  rpc PrepareImagesUpload (PrepareImagesUploadRequest) returns (PrepareImagesUploadResponse);
  rpc ConfirmImageUpload (ConfirmImageUploadRequest) returns (ConfirmImageUploadResponse);
  rpc ConfirmImagesUpload (ConfirmImagesUploadRequest) returns (ConfirmImagesUploadResponse);
  rpc DeleteImage (DeleteImageRequest) returns (DeleteImageResponse);
}
